<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="个人主页入口：访问 portfolio.72945645.xyz 查看作品与介绍。">
    <title>个人主页入口</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: light dark;
        background: #f5f7fb;
        color: #182438;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 520px);
        padding: clamp(28px, 7vw, 48px);
        border: 1px solid #dce3ee;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 16px 48px rgb(20 40 70 / 8%);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(28px, 6vw, 38px);
        line-height: 1.25;
        letter-spacing: -.02em;
      }

      p {
        margin: 0 0 28px;
        color: #475569;
        font-size: 16px;
        line-height: 1.75;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 20px;
        border-radius: 10px;
        background: #175cd3;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        transition: background-color .15s ease;
      }

      a:hover { background: #0d47a6; }
      a:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }

      small {
        display: block;
        margin-top: 18px;
        color: #64748b;
        overflow-wrap: anywhere;
      }

      @media (prefers-color-scheme: dark) {
        :root { background: #101827; color: #f1f5f9; }
        main { background: #1b2738; border-color: #334155; box-shadow: none; }
        p { color: #cbd5e1; }
        small { color: #94a3b8; }
        a { background: #3882ec; color: #fff; }
        a:hover { background: #1d6fdd; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>欢迎来到我的主页</h1>
      <p>作品与介绍请前往正式主页查看。</p>
      <a href="https://portfolio.72945645.xyz/">访问正式主页</a>
      <small>portfolio.72945645.xyz</small>
    </main>
  </body>
</html>
